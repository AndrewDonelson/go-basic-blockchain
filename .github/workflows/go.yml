# CI for go-basic-blockchain.
#
# The original workflow pinned Go 1.19 while go.mod required 1.22, and ran only
# `go build` and `go test` -- no race detector, no vet, no lint, no vulnerability
# scan, and no coverage. Three different Go versions were declared across
# go.mod, this file and .golangci.yml.
#
# One version now, in one place: go.mod declares it, and everything here follows.
name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares go 1.27 and a toolchain floor of go1.27.1. Older
        # releases carry standard-library vulnerabilities that no change in this
        # repository can fix, so there is nothing to gain from testing on them.
        go-version: ["1.27"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test (race detector + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out -timeout 5m ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        if: matrix.go-version == '1.27'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      # golangci-lint v2 requires action v8 and the v2 config schema, which
      # .golangci.yml now uses. Pinning the action major version keeps the two in
      # step; "latest" for the linter itself is deliberate, so a new check shows
      # up here rather than in a surprise months later.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
