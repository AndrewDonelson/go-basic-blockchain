openapi: 3.0.3
info:
  title: Go Basic Blockchain API
  version: 0.1.0
  description: |
    REST API for a Go Basic Blockchain node.

    This specification is the contract. Before it existed the only description of
    the API was a Postman collection, so a client author had to read the handlers.

    **Authentication.** Every path outside the public list requires an API key.
    Authentication fails closed: there is no built-in fallback credential, so
    `BLOCKCHAIN_API_KEY` and `BLOCKCHAIN_SERVER_SEED` must be set before the API
    accepts anything.

    **Errors.** Every failure returns the same JSON envelope, on every path and
    for every status code.

    **Versioning.** Every endpoint is served under `/v1`. The same endpoints are
    also served unprefixed for compatibility with existing clients; that surface
    is frozen and will not gain new endpoints. New clients should use `/v1`.
  license:
    name: See repository LICENSE

servers:
  - url: https://localhost:8100
    description: Local node with API_TLS_ENABLED=true
  - url: http://localhost:8100
    description: Local node serving plaintext (the default; terminate TLS at a proxy)

tags:
  - name: Public
    description: No credential required
  - name: Chain
    description: Blocks and transactions
  - name: Wallets
  - name: Accounts
  - name: Consensus
    description: Node-to-node endpoints, authenticated as a peer
  - name: Applications
    description: |
      Submit signed transactions and read back publisher registrations and
      sidechain anchors. Served under /v1 only. See docs/sidechains.md, "Using
      sidechains from an application".

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number. Out-of-range values are clamped.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Items per page. Clamped to a server maximum.
      schema: { type: integer, minimum: 1, default: 20 }

  schemas:
    Error:
      type: object
      description: |
        The single shape every API error takes. `status` repeats the HTTP status
        because a client holding only the payload -- a log line, a queued webhook
        -- cannot otherwise tell a 400 from a 500.
      required: [message, status]
      properties:
        message: { type: string, example: invalid api key }
        status: { type: integer, example: 401 }

    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        block_count: { type: integer }
        mempool_size: { type: integer }

    Block:
      type: object
      properties:
        index: { type: string, description: Block height as a decimal string }
        hash: { type: string }
        header:
          type: object
          properties:
            previous_hash: { type: string }
            timestamp: { type: string, format: date-time }
            difficulty:
              type: integer
              description: |
                Exponent, not a linear scalar: expected work is 2^difficulty.
                Derived from chain history, not configuration.
            nonce: { type: integer }
            merkle_root: { type: string }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }

    Transaction:
      type: object
      properties:
        id: { type: string, description: "PUID, formatted organizationID:appID:userID:assetID" }
        protocol:
          type: string
          enum: [COINBASE, BANK, MESSAGE, PERSIST, CHAIN, P2P, ANCHOR, REGISTER, AVAILABILITY]
          description: |
            The wire discriminator. Without it the Transaction interface cannot
            be decoded, and blocks carrying transactions cannot be reloaded.
        from: { type: string }
        to: { type: string }
        fee: { type: number, format: double }
        status: { type: string, enum: [pending, confirmed, failed] }

    Wallet:
      type: object
      properties:
        id: { type: string }
        address: { type: string }
        name: { type: string }
        encrypted: { type: boolean }

    Balance:
      type: object
      properties:
        address: { type: string }
        balance:
          type: number
          format: double
          description: |
            Derived from the UTXO set, which is the authoritative record. A
            wallet's own stored balance is advisory.

    Paginated:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    TransactionSubmission:
      type: object
      description: |
        The reply to POST /v1/transactions. Resubmitting a transaction the node
        already knows is a success (`known: true`), so a client that timed out can
        retry safely.
      required: [status]
      properties:
        id: { type: string, description: The transaction id, whenever the body decoded }
        status:
          type: string
          enum: [pending, confirmed, rejected]
          description: |
            `pending` -- in the mempool. `confirmed` -- a transaction with this id
            is already in a block. `rejected` -- refused; see `reason`.
        known: { type: boolean, description: True when the node already had this id }
        reason: { type: string, description: Why the transaction was rejected }

    GameInfo:
      type: object
      properties:
        game_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, description: Metadata only; not unique within a publisher }
        registered_at_height: { type: integer, format: int64 }

    PublisherInfo:
      type: object
      properties:
        publisher_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        public_key_pem:
          type: string
          description: The P-256 identity key that signs anchors and game registrations
        key_fingerprint:
          type: string
          description: |
            Lowercase hex SHA-256 of the identity key's PKIX DER encoding -- the
            value `GET /v1/publishers?key=` looks a publisher up by. It equals the
            key's PeerIdentity NodeID.
        bond_units: { type: integer, format: int64 }
        registered_at_height: { type: integer, format: int64 }
        games:
          type: array
          description: In game-id order
          items: { $ref: '#/components/schemas/GameInfo' }

    AnchorInfo:
      type: object
      properties:
        publisher_id: { type: integer, format: int64 }
        game_id: { type: integer, format: int64 }
        from_height: { type: integer, format: int64, description: Inclusive }
        to_height: { type: integer, format: int64, description: Inclusive }
        tip_hash: { type: string, description: Hex hash of the sidechain block at to_height }
        header_root: { type: string, description: Hex Merkle root over the block hashes in the range }
        payload_count: { type: integer, format: int64, description: Advisory }
        main_block_index: { type: integer, format: int64, description: The main-chain block carrying the anchor }
        main_block_hash: { type: string }
        transaction_id: { type: string, description: The ANCHOR transaction's id }

    AnchorList:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            publisher_id: { type: integer, format: int64 }
            game_id: { type: integer, format: int64 }
            delinquent:
              type: boolean
              description: Whether the sidechain has ever exceeded MaxAnchorGap
            anchors:
              type: array
              description: Oldest first
              items: { $ref: '#/components/schemas/AnchorInfo' }

    TransactionInfo:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, confirmed] }
        block_index: { type: integer, format: int64, description: The main-chain block carrying a confirmed transaction }
        confirmations: { type: integer, format: int64, description: That block plus every block mined on top of it }

    AccountInfo:
      type: object
      required: [address, balance_units, last_nonce, has_nonce, pending_nonce, has_pending]
      properties:
        address: { type: string }
        balance_units: { type: integer, format: int64, description: Spendable balance in base units }
        last_nonce: { type: integer, format: int64, description: Highest nonce the chain has confirmed for this sender }
        has_nonce: { type: boolean, description: False when the chain has confirmed none (the first nonce may be 0) }
        pending_nonce: { type: integer, format: int64, description: Highest nonce waiting in this node's mempool }
        has_pending: { type: boolean }

  responses:
    Unauthorized:
      description: Missing, malformed or unrecognised credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: |
        Well formed but semantically rejected -- a bad signature, insufficient
        funds, or a block that does not extend the head.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - ApiKeyAuth: []

paths:
  /v1:
    get:
      tags: [Public]
      summary: HTML summary of the chain
      security: []
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema: { type: string }

  /v1/version:
    get:
      tags: [Public]
      summary: Node version
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }

  /v1/info:
    get:
      tags: [Public]
      summary: Chain parameters as JSON
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }

  /v1/health:
    get:
      tags: [Public]
      summary: Liveness and basic counts
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /v1/metrics:
    get:
      tags: [Public]
      summary: Prometheus metrics
      description: |
        Public by design. A metrics endpoint behind authentication is one no
        scraper gets configured for, and this exposes counts, timings and a hash
        rate -- no addresses, balances or keys.
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  /v1/account/register:
    post:
      tags: [Public, Accounts]
      summary: Register an account
      description: |
        POST, not GET: it creates state and carries a credential, neither of
        which belongs in a query string.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/account/login:
    post:
      tags: [Public, Accounts]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/account/verify:
    get:
      tags: [Public, Accounts]
      summary: Verify an account
      security: []
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/blockchain:
    get:
      tags: [Chain]
      summary: Chain status
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/blockchain/blocks:
    get:
      tags: [Chain]
      summary: List blocks
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      blocks:
                        type: array
                        items: { $ref: '#/components/schemas/Block' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/blockchain/blocks/{index}:
    get:
      tags: [Chain]
      summary: A block by height
      parameters:
        - { name: index, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Block' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blockchain/blocks/{index}/transactions:
    get:
      tags: [Chain]
      summary: Transactions in a block
      parameters:
        - { name: index, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blockchain/blocks/{index}/transactions/{id}:
    get:
      tags: [Chain]
      summary: One transaction in a block
      parameters:
        - { name: index, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blockchain/transactions:
    get:
      tags: [Chain]
      summary: List transactions
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/blockchain/transactions/{id}:
    get:
      tags: [Chain]
      summary: A transaction by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blockchain/wallets:
    get:
      tags: [Wallets]
      summary: List wallets
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/blockchain/wallets/new:
    post:
      tags: [Wallets]
      summary: Create a wallet
      description: |
        Every wallet is derived from a BIP-39 recovery phrase. The phrase is
        returned once, at creation, and never stored: a recovery phrase kept
        beside the wallet it recovers protects nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, passphrase]
              properties:
                name: { type: string }
                passphrase: { type: string, format: password }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: |
            Created. The `mnemonic` is returned here and nowhere else -- it is
            never stored, so this response is the only chance to keep it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Wallet'
                  - type: object
                    properties:
                      mnemonic:
                        type: string
                        description: BIP-39 recovery phrase; shown once, never stored.
                      warning: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/blockchain/wallets/tx:
    post:
      tags: [Wallets]
      summary: Submit a wallet transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string }
                to: { type: string }
                amount: { type: number, format: double }
                protocol: { type: string, enum: [BANK, MESSAGE] }
      responses:
        '201': { description: Accepted into the mempool }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/blockchain/wallets/{id}:
    get:
      tags: [Wallets]
      summary: A wallet by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Wallets]
      summary: Update a wallet
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blockchain/wallets/{id}/balance:
    get:
      tags: [Wallets]
      summary: A wallet's balance
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blockchain/wallets/{id}/transactions:
    get:
      tags: [Wallets]
      summary: A wallet's transactions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blockchain/wallets/{id}/transactions/{txid}:
    get:
      tags: [Wallets]
      summary: One transaction for a wallet
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: txid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/consensus/p2p:
    post:
      tags: [Consensus]
      summary: Receive a P2P consensus message
      responses:
        '201': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Consensus authentication is not configured }

  /v1/consensus/tx:
    post:
      tags: [Consensus]
      summary: Receive a relayed transaction
      responses:
        '201': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/consensus/block:
    post:
      tags: [Consensus]
      summary: Receive an announced block
      responses:
        '201': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/transactions:
    post:
      tags: [Applications]
      summary: Submit a signed transaction
      description: |
        Accepts a signed transaction in the same canonical wire format as
        /consensus/tx (the JSON `EncodeTransaction` produces, discriminated by
        `protocol`) and runs exactly the same validation and signature check.
        A COINBASE is always refused. An accepted transaction is queued locally
        and relayed to peers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Transaction' }
      responses:
        '202':
          description: Queued and relayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionSubmission' }
        '200':
          description: Already known -- an idempotent success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionSubmission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Refused -- invalid, badly signed, unaffordable, a coinbase, or a stale nonce
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionSubmission' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/publishers:
    get:
      tags: [Applications]
      summary: Find a publisher by its identity key
      description: |
        Publisher ids are allocated by consensus, so a registrant learns theirs
        only after the REGISTER transaction confirms. This is how: look the
        publisher up by the key it registered.
      parameters:
        - name: key
          in: query
          required: true
          description: |
            Lowercase hex SHA-256 of the identity key's PKIX DER encoding (64 hex
            characters). Equal to the key's PeerIdentity NodeID.
          schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/publishers/{id}:
    get:
      tags: [Applications]
      summary: View a registered publisher and its games
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/transactions/{id}:
    get:
      tags: [Applications]
      summary: Whether a submitted transaction is pending or mined, and where
      description: |
        An id this node doesn't know (never seen, or dropped from the mempool)
        is a 404, so an application can rebuild and resubmit.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/accounts/{address}:
    get:
      tags: [Applications]
      summary: An address's spendable balance and nonces
      description: |
        What an application needs to fund and sequence transactions it builds
        itself: the next transaction carries one more than the larger of
        last_nonce and pending_nonce.
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/sidechains/{publisherID}/{gameID}/anchors:
    get:
      tags: [Applications]
      summary: List the anchors recorded on chain for a sidechain
      description: |
        Oldest first. Each anchor names the main-chain block that carries it.
        An unregistered (publisher, game) pair is a 404; a registered one with
        nothing anchored yet is a 200 with an empty list.
      parameters:
        - name: publisherID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: gameID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnchorList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
